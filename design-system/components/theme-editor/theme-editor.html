<!-- theme-editor — the 「색 편집」 panel: material, palette examples and a picker per colour token.
     <ds-theme-editor class="popover dock-pop" hidden></ds-theme-editor>
     class    popover (its look); dock-pop when it opens off a <ds-dock>
     hidden   toggle it to open and close; the element renders when shown
     Always empty: the element renders its rows and saves adash.theme.custom and adash.material.
     The example below is opened in place (no dock-pop) so the preview can show it. -->
<ds-theme-editor class="popover" style="position: static; width: auto; max-height: none"></ds-theme-editor>
