<!-- dock — the floating bar. One per page, a direct child of <body>.
     <ds-dock id="…" sheet-title="…">                                                         sheet-title: optional (half folded)
       <a href="#view" data-tip="name" aria-label="name"><ds-icon name="…"></ds-icon></a>     a tab; the current one has .on
       <a …><ds-icon …></ds-icon><b class="dn" hidden>0</b></a>                               a tab with a count badge
       <a … data-name="홈">…</a>                                                               a tab named under its icon
       <i class="dock-sep" data-label="group"></i>                                            a divider between groups; data-label
                                                                                              (optional) heads the group in the 설정 menu and the sheet
       <label class="dock-btn" data-tip="name" aria-label="name"><input type="checkbox"><ds-icon …></ds-icon></label>   a toggle
       <button class="dock-btn" data-tip="name" aria-label="name"><ds-icon …></ds-icon></button>                      a button
     </ds-dock>
     Icons only: every item has data-tip (hover name) and aria-label (accessible name).
     The element adds 설정 itself, a round button of its own beside the bar (.dock-fab at the end of <body>: at the right
     end of a bottom or top bar's edge, at the top right below the status bar's clock for a side bar); do not write one.
     data-more on an item (or a separator) keeps it off the bar: it is a named row in the 설정 menu (a separator's
     data-label heads a group there). Like the App Store's tab bar, the bar keeps to the few screens used most, each
     with data-name (its name under the icon); the rest go in 설정, where a count badge shows on its row only (설정 gets no dot).
     data-fab on an item keeps it beside 설정 instead, in its round box (on its left by a bottom or top bar, below it by a
     side bar), off the bar and out of the menu: for the one action used from every screen.
     The user can move any named item between the bar and the menu (설정 「바에 둘 항목」, data-more is the default) and
     fold the bar to one button (「바 숨기기」); give an item data-key when its id, input id and href are all missing.
     Phone (≤500px): the same bar at the bottom with 설정 at its right, the 설정 menu a sheet across the screen above it. Half folded
     (<html data-posture>) the bar is a sheet ([open]) on the second half holding every child, menu items included (tabs
     two to a row, toggles as rows with a switch, data-tip as each row's name); the element adds its .dock-head
     (sheet-title, default 「이동과 설정」) itself; do not write it.
     Popovers opened from the bar: <div class="… dock-pop" hidden> at the end of <body>, toggled with hidden; opening
     one closes the others, and a click outside them (not on the bar or a <dialog>) closes the open one. Placement before first paint needs components/dock/dock-boot.js in <head>. -->
<!-- @story 기본 — 이름 붙은 탭(data-name), 토글·버튼과 구분선 -->
<ds-dock>
  <a href="#" class="on" data-tip="에이전트" data-name="에이전트" aria-label="에이전트"><ds-icon name="users"></ds-icon></a>
  <a href="#" data-tip="비교" aria-label="비교"><ds-icon name="chart"></ds-icon></a>
  <a href="#" data-tip="테스트" aria-label="테스트"><ds-icon name="flask"></ds-icon><b class="dn">2</b></a>
  <i class="dock-sep" data-label="필터"></i>
  <label class="dock-btn" data-tip="실행 중만" aria-label="실행 중만"><input type="checkbox"><ds-icon name="pulse"></ds-icon></label>
  <i class="dock-sep" data-label="설정"></i>
  <button class="dock-btn" data-tip="색 편집" aria-label="색 편집"><ds-icon name="palette"></ds-icon></button>
</ds-dock>
<!-- @story 시트 열림 — 반 접힘에서 둘째 화면을 채우는 이름 붙은 시트 -->
<ds-dock sheet-title="이동과 설정" data-story-play="this.open(true)">
  <a href="#" class="on" data-tip="에이전트" aria-label="에이전트"><ds-icon name="users"></ds-icon></a>
  <a href="#" data-tip="비교" aria-label="비교"><ds-icon name="chart"></ds-icon></a>
  <a href="#" data-tip="테스트" aria-label="테스트"><ds-icon name="flask"></ds-icon><b class="dn">2</b></a>
  <i class="dock-sep" data-label="필터"></i>
  <label class="dock-btn" data-tip="실행 중만" aria-label="실행 중만"><input type="checkbox"><ds-icon name="pulse"></ds-icon></label>
  <i class="dock-sep" data-label="설정"></i>
  <button class="dock-btn" data-tip="색 편집" aria-label="색 편집"><ds-icon name="palette"></ds-icon></button>
</ds-dock>
<!-- @story 설정 메뉴 — data-more 항목은 바 옆 설정 메뉴의 이름 붙은 행으로, 묶음 제목은 구분선의 data-label -->
<ds-dock data-story-play="setTimeout(() => this.cfg.click())">
  <a href="#" class="on" data-tip="에이전트" aria-label="에이전트"><ds-icon name="users"></ds-icon></a>
  <a href="#" data-tip="비교" aria-label="비교"><ds-icon name="chart"></ds-icon></a>
  <i class="dock-sep" data-label="설정"></i>
  <button class="dock-btn" data-tip="메트릭 서버" aria-label="메트릭 서버"><ds-icon name="server"></ds-icon></button>
  <label class="dock-btn" data-more data-tip="캐릭터 모드" aria-label="캐릭터 모드"><input type="checkbox" checked><ds-icon name="smile"></ds-icon></label>
  <button class="dock-btn" data-more data-tip="색 편집" aria-label="색 편집"><ds-icon name="palette"></ds-icon></button>
  <a href="#" data-more data-tip="디자인 시스템" aria-label="디자인 시스템"><ds-icon name="shapes"></ds-icon></a>
</ds-dock>
<!-- @story 설정 옆 항목 — data-fab 항목은 바도 메뉴도 아닌 설정 버튼 옆에 -->
<ds-dock>
  <a href="#" class="on" data-tip="에이전트" data-name="에이전트" aria-label="에이전트"><ds-icon name="users"></ds-icon></a>
  <a href="#" data-tip="비교" data-name="비교" aria-label="비교"><ds-icon name="chart"></ds-icon></a>
  <button class="dock-btn" data-fab data-tip="새 에이전트" aria-label="새 에이전트"><ds-icon name="plus"></ds-icon></button>
  <button class="dock-btn" data-more data-tip="색 편집" aria-label="색 편집"><ds-icon name="palette"></ds-icon></button>
</ds-dock>
<!-- @story 바에 둘 항목 — 설정 메뉴의 「바에 둘 항목」을 펼친 상태: 체크를 끄면 그 항목이 메뉴로 -->
<ds-dock data-story-play="setTimeout(() => { this.cfg.click(); this.menu.querySelector('.dock-items').open = true; })">
  <a href="#a" class="on" data-tip="에이전트" aria-label="에이전트"><ds-icon name="users"></ds-icon></a>
  <a href="#b" data-tip="비교" aria-label="비교"><ds-icon name="chart"></ds-icon></a>
  <i class="dock-sep" data-label="설정"></i>
  <button class="dock-btn" data-tip="메트릭 서버" aria-label="메트릭 서버"><ds-icon name="server"></ds-icon></button>
  <button class="dock-btn" data-more data-tip="색 편집" aria-label="색 편집"><ds-icon name="palette"></ds-icon></button>
</ds-dock>
<!-- @story 배지 없음 — 개수 배지가 숨은 탭 (hidden) -->
<ds-dock>
  <a href="#" class="on" data-tip="에이전트" aria-label="에이전트"><ds-icon name="users"></ds-icon></a>
  <a href="#" data-tip="테스트" aria-label="테스트"><ds-icon name="flask"></ds-icon><b class="dn" hidden>0</b></a>
</ds-dock>
