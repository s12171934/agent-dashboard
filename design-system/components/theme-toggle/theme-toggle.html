<!-- theme-toggle — one button that cycles the colour theme (시스템 → 라이트 → 다크).
     <ds-theme-toggle button-class="CLASS"></ds-theme-toggle>
     button-class   classes for the <button> it renders (dock-btn inside a <ds-dock>, act elsewhere)
     Always empty: the element renders the button, its three icons, data-tip and aria-label, and saves adash.theme. -->
<div class="row">
  <ds-theme-toggle button-class="act big"></ds-theme-toggle>
  <span class="st">누를 때마다 시스템 → 라이트 → 다크</span>
</div>
