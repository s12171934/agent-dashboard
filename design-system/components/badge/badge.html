<!-- badge — a short tag next to a name.
     <span class="badge">text</span>
     One or two words. Colour variants (e.g. .badge.coord) belong to the page; the system gives the neutral one. -->
<!-- @story 기본 — 이름 옆의 짧은 꼬리표 -->
<div class="row">
  <span class="badge">claude</span>
  <span class="badge">codex</span>
</div>
<!-- @story 이름 옆 — 제목 줄에 붙은 모습 -->
<div class="row"><b>리퀴드글래스 UI</b> <span class="badge">claude</span> <span class="badge">워커</span></div>
