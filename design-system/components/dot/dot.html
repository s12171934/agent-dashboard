<!-- dot — a small status dot.
     <span class="dot"></span>          idle (grey)
     <span class="dot live"></span>     live (pulses in --ok)
     Put it before the text it qualifies; it carries no text of its own. -->
<!-- @story 유휴 — 회색 점 -->
<div class="row"><span class="dot"></span> 유휴</div>
<!-- @story 실행 중 — --ok 색으로 맥박 -->
<div class="row"><span class="dot live"></span> 실행 중</div>
