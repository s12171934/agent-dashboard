<!-- kpi — figures at a glance.
     <div class="kpis">
       <div class="kpi"><span>label</span><b>figure</b><small> · note</small></div>    note optional
     </div>
     Tiles flow in columns of at least 130px. Figures use tabular numbers. -->
<!-- @story 기본 — 라벨과 숫자 -->
<div class="kpis">
  <div class="kpi"><span>턴</span><b>136</b></div>
  <div class="kpi"><span>도구 호출</span><b>412</b></div>
</div>
<!-- @story 메모 포함 — <small> 메모 -->
<div class="kpis">
  <div class="kpi"><span>현재 컨텍스트</span><b>388.6k</b><small> / 1.0M</small></div>
  <div class="kpi"><span>비용</span><b>$11.20</b><small> · $0.08/턴</small></div>
</div>
<!-- @story 많은 타일 — 130px 이상의 열로 흐름 -->
<div class="kpis">
  <div class="kpi"><span>턴</span><b>136</b></div>
  <div class="kpi"><span>현재 컨텍스트</span><b>388.6k</b><small> / 1.0M</small></div>
  <div class="kpi"><span>비용</span><b>$11.20</b><small> · $0.08/턴</small></div>
  <div class="kpi"><span>캐시 적중</span><b>94%</b></div>
  <div class="kpi"><span>실행 시간</span><b>2:14:08</b></div>
  <div class="kpi"><span>워커</span><b>4</b><small> · 실행 중 1</small></div>
</div>
