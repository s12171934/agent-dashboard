<!-- panes — two equal panes side by side, the gap on the fold.
     <div class="panes">
       <div class="box">…</div>    first pane (list, summary)
       <div class="box">…</div>    second pane (detail, log)
     </div>
     Exactly two children. They stack at max-width 700px, but stay side by side in the fold layout (an unfolded
     foldable, GUIDELINES B8) so each half of the screen holds one pane. Put the panes where they span the page's
     width (symmetric padding), so their gap lands on the fold. The gap is --pane-gap; nothing else to set. -->
