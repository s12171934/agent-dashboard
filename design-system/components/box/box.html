<!-- box — a pane holding one block of a page.
     <div class="box"><h3>Title <span class="st">extra</span></h3> … </div>
     <details class="box" open><summary><b>Title</b> <span class="st">extra</span></summary> … </details>   foldable
     The heading is optional; its extras (counts, tools) sit inline after the title. Boxes stack with 14px between. -->
<!-- @story 제목 있음 — <h3> 과 인라인 메모 -->
<div class="box"><h3>비용 구성 <span class="st">$11.20</span></h3><div class="st">내용</div></div>
<!-- @story 제목 없음 -->
<div class="box"><div class="st">제목 없이 내용만 담은 상자</div></div>
<!-- @story 접이식 열림 — <details class="box" open> -->
<details class="box" open><summary><b>워커 4</b> <span class="st">실행 중 1 · 합계 비용 $3.10</span></summary><div class="st" style="margin-top: 8px">접을 수 있는 내용</div></details>
<!-- @story 접이식 닫힘 -->
<details class="box"><summary><b>완료 워커 12</b> <span class="st">합계 비용 $8.40</span></summary><div class="st" style="margin-top: 8px">접힌 내용</div></details>
