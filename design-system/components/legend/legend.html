<!-- legend — what each colour of a chart means.
     <div class="legend"><span><i style="background: COLOUR"></i>name</span> …</div>
     One <span> per series, in the chart's order. -->
<!-- @story 기본 — 차트 순서대로 한 줄 -->
<div class="legend"><span><i style="background: var(--s-input)"></i>입력</span><span><i style="background: var(--s-write)"></i>캐시 쓰기</span><span><i style="background: var(--s-read)"></i>캐시 읽기</span><span><i style="background: var(--s-out)"></i>출력</span></div>
<!-- @story 항목이 많을 때 — 줄바꿈 -->
<div class="legend"><span><i style="background: var(--c1)"></i>리퀴드글래스 UI</span><span><i style="background: var(--c2)"></i>대시보드 실행</span><span><i style="background: var(--c3)"></i>서버 분리</span><span><i style="background: var(--c4)"></i>디자인 시스템 점검</span><span><i style="background: var(--c5)"></i>PWA 아이콘</span><span><i style="background: var(--c6)"></i>바 위치 고정</span><span><i style="background: var(--c7)"></i>기타</span></div>
