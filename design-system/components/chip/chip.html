<!-- chip — a named count in a colour.
     <span class="chip" style="--c: COLOUR">label <i>n</i></span>
     --c    a palette token (var(--c1) … var(--c7), or a state colour)
     <i>    the count; leave it out for a chip without one -->
<div class="row">
  <span class="chip" style="--c: var(--c1)">orca-cli <i>3</i></span>
  <span class="chip" style="--c: var(--c2)">MCP <i>1</i></span>
  <span class="chip" style="--c: var(--c3)">aplan</span>
</div>
