<!-- button — small actions.
     <button class="act">label</button>            a small pill button
     <button class="act big">label</button>        a larger one, for the main action of a row
     <button class="act accent">label</button>     a positive action (open, restore)
     <button class="act danger">label</button>     a destructive one (close, delete)
     <button class="tgl">▸ label n</button>         a link-like toggle that shows or hides a block (▸ closed, ▾ open)
     Always <button type="button"> semantics (a real <button>); disabled with the disabled attribute. -->
<!-- @story 기본 — .act: 작은 알약 버튼 -->
<div class="row"><button class="act">유휴로</button></div>
<!-- @story 비활성 — disabled 속성 -->
<div class="row"><button class="act" disabled>기본값</button> <button class="act big accent" disabled>Orca 에서 열기</button></div>
<!-- @story 큰 버튼 — .act.big: 한 줄의 주 동작 -->
<div class="row"><button class="act big">새로 고침</button></div>
<!-- @story 긍정 — .act.accent: 열기, 되살리기 -->
<div class="row"><button class="act accent">열기</button> <button class="act big accent">Orca 에서 열기</button></div>
<!-- @story 위험 — .act.danger: 닫기, 지우기 -->
<div class="row"><button class="act danger">지우기</button> <button class="act big danger">닫기</button></div>
<!-- @story 토글 — .tgl: 블록을 펴고 접는 링크 모양 (▸ 닫힘, ▾ 열림) -->
<div class="row"><button class="tgl">▸ 완료 워커 4</button> <button class="tgl">▾ 완료 워커 4</button></div>
<!-- @story 긴 라벨 — 좁은 폭에서 줄바꿈과 넘침 -->
<div class="row"><button class="act big accent">이 세션의 Orca 터미널을 새 창에서 열고 작업 기록을 모두 가져오기</button></div>
