<!-- segmented — one choice out of a few.
     <span class="seg">
       <button class="on">A</button>     the current choice has .on
       <button>B</button>
     </span>
     Two to six options, short labels. The page moves .on and acts on click; a disabled option uses disabled. -->
<div class="row">
  <span class="seg"><button class="on">합계</button><button>시간별</button></span>
  <span class="seg"><button>5분</button><button>15분</button><button class="on">1시간</button><button disabled>1일</button></span>
</div>
