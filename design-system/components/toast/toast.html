<!-- toast — a short notice at the bottom of the page, optionally with one action (e.g. 되돌리기).
     <ds-toast id="toast"></ds-toast>       one per page, at the end of <body>
     Script API: toast.show(message, { action, onAction }, ms). message is plain text. -->
<!-- @story 버튼으로 띄우기 — toast.show(…) -->
<button class="act" onclick="this.nextElementSibling.show('3개를 숨겼습니다', { action: '되돌리기', onAction: () => {} })">토스트 띄우기</button>
<ds-toast></ds-toast>
<!-- @story 동작 있음 — 「되돌리기」 버튼과 함께 떠 있음 -->
<ds-toast data-story-play="this.show('3개를 숨겼습니다', { action: '되돌리기', onAction: () => {} }, 1e9)"></ds-toast>
<!-- @story 메시지만 — 동작 없는 알림 -->
<ds-toast data-story-play="this.show('서버에 다시 연결했습니다', {}, 1e9)"></ds-toast>
<!-- @story 긴 메시지 — 좁은 폭에서 줄바꿈 -->
<ds-toast data-story-play="this.show('리퀴드글래스 UI 세션의 Orca 터미널을 닫았습니다. 세션 기록은 남아 있으니 언제든 다시 열 수 있습니다', { action: '되돌리기', onAction: () => {} }, 1e9)"></ds-toast>
