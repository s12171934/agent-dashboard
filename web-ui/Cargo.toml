[package]
name = "agent-dashboard-ui"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
urlencoding = "2"
pulldown-cmark = "0.13"

[target.'cfg(target_arch = "wasm32")'.dependencies]
agent-dashboard-client-core = { path = "../client-core" }
leptos = { version = "0.8", default-features = false, features = ["csr"] }
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "0.4"
serde-wasm-bindgen = "0.6"
send_wrapper = "0.6"
js-sys = "0.3"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlElement", "HtmlInputElement", "HtmlSelectElement", "HtmlTextAreaElement", "HtmlVideoElement", "HtmlMediaElement", "Event", "EventTarget", "KeyboardEvent", "PointerEvent", "MouseEvent", "Location", "Storage", "DomRect", "HtmlDialogElement", "File", "FileList", "Blob", "Url", "Navigator", "Clipboard", "Node", "console"] }

[profile.release]
lto = "thin"
opt-level = "s"
codegen-units = 1
strip = "debuginfo"
