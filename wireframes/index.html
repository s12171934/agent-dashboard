<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>와이어프레임 보드</title>
<link rel="stylesheet" href="board.css">
</head>
<body>
<aside class="side" id="side" aria-label="보드 설정">
  <div class="side-top">
    <h1>와이어프레임 보드</h1>
    <button class="icon" id="side-close" aria-label="설정 접기" title="설정 접기">‹</button>
  </div>
  <p class="meta" id="meta"></p>

  <!-- always in view: how the board is laid out and how big -->
  <div class="pin">
    <div class="seg" id="view" role="radiogroup" aria-label="보기">
      <button data-v="grid" aria-pressed="true">격자</button>
      <button data-v="map" aria-pressed="false">흐름 지도</button>
    </div>
    <label class="fld zoom">배율 <input type="range" id="zoom" min="0.1" max="0.6" step="0.02" value="0.24"><output id="zoom-out">24%</output></label>
  </div>
  <div class="tools">
    <button data-acc="1">모두 펼치기</button><button data-acc="0">모두 접기</button><span class="grow"></span><button id="reset" title="숨긴 것과 필터를 모두 되돌린다">초기화</button>
  </div>

  <!-- accordions: each one's summary keeps its state in view while it is closed (badge = how many are on) -->
  <p class="part">보드</p>
  <details class="acc" data-acc="widths">
    <summary><span class="nm">폭</span><span class="badge" id="b-widths"></span><span class="all"><button data-all="widths" data-on="1">전체</button><button data-all="widths" data-on="0">없음</button></span></summary>
    <div class="list" id="widths" aria-label="폭"></div>
  </details>
  <details class="acc" data-acc="filter">
    <summary><span class="nm">필터</span><span class="badge" id="b-filter"></span></summary>
    <div class="list">
      <label class="fld">묶음 <select id="group"><option value="">전체</option></select></label>
      <label class="fld">상태 <select id="status">
        <option value="">전체</option><option value="none">미작성</option><option value="draft">시안</option><option value="picked">확정</option>
      </select></label>
      <label class="fld" id="variants-fld">시안 <select id="variants">
        <option value="all">나란히</option><option value="one">하나씩</option>
      </select></label>
    </div>
  </details>
  <details class="acc" data-acc="screens">
    <summary><span class="nm">화면 내용</span><span class="badge" id="b-screens"></span><span class="all"><button data-all="screens" data-on="1">전체</button><button data-all="screens" data-on="0">없음</button></span></summary>
    <p class="hint">끈 화면은 보드에서 빠지고, 다른 화면에서 그 화면으로 가는 메뉴·버튼도 숨는다.</p>
    <div class="list" id="screens" aria-label="화면 내용"></div>
  </details>

  <p class="part">프레임 안</p>
  <details class="acc" data-acc="frame">
    <summary><span class="nm">표시</span><span class="badge" id="b-frame"></span></summary>
    <div class="list">
      <label class="chk"><input type="checkbox" id="full"> 전체 길이</label>
      <label class="chk"><input type="checkbox" id="slots"> 슬롯 경계 표시</label>
    </div>
  </details>
  <details class="acc" data-acc="areas">
    <summary><span class="nm">화면 영역</span><span class="badge" id="b-areas"></span><span class="all"><button data-all="areas" data-on="1">전체</button><button data-all="areas" data-on="0">없음</button></span></summary>
    <div class="list" id="areas" aria-label="화면 영역"></div>
  </details>
  <details class="acc" data-acc="slotlist">
    <summary><span class="nm">플러그인 슬롯</span><span class="badge" id="b-slotlist"></span><span class="all"><button data-all="slotlist" data-on="1">전체</button><button data-all="slotlist" data-on="0">없음</button></span></summary>
    <div class="list" id="slotlist" aria-label="플러그인 슬롯"></div>
  </details>
</aside>
<button class="icon side-open" id="side-open" aria-label="설정 펼치기" title="설정 펼치기">›</button>
<main id="board" tabindex="-1"></main>
<dialog id="focus">
  <div class="fbar">
    <strong id="f-title"></strong>
    <div class="seg" id="f-widths"></div>
    <div class="seg" aria-label="크기"><button id="f-fit" aria-pressed="true">맞춤</button><button id="f-actual" aria-pressed="false">실제 크기</button></div>
    <span class="meta" id="f-scale"></span>
    <span class="grow"></span>
    <a id="f-open" target="_blank" rel="noopener">새 탭으로 열기</a>
    <button id="f-close" aria-label="닫기">닫기</button>
  </div>
  <div class="fbody"><iframe id="f-frame" title="와이어프레임 크게 보기"></iframe></div>
</dialog>
<script type="module" src="board.js"></script>
</body>
</html>
