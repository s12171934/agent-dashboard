<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>비교 · 비용 · 와이어프레임</title>
<!-- Plugin-filled areas carry data-slot="<slot>" data-plugin="<plugin id>" (FLOW.md 「컨셉」); the core's own parts carry none.
     Copy this file to screens/<screen id>/<variant>.html (a.html, b.html …). Only wf.css and wf.js, nothing else, no real data.
     Keep the shell (sidebar · dock · half sheet) as it is: mark the current screen with class "on" and change only <main> and the sheet's lower part. -->
<link rel="stylesheet" href="../../wf.css">
<script src="../../wf.js"></script>
<style>
.wire-filters { display: flex; flex-wrap: wrap; gap: 6px; }
.wire-filter { display: flex; flex-direction: column; gap: 2px; min-width: 0; max-width: 100%; }
.wire-filter .wf-input { min-width: 0; max-width: 100%; color: var(--wf-ink); font: inherit; font-size: 12px; }

.cost-bars { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); align-items: end; gap: 8px; }
.cost-bin { text-align: center; min-width: 0; }
.cost-bar { display: block; height: var(--height); background: var(--wf-fill); border-radius: 4px 4px 0 0; }
.cost-table { width: 100%; border-collapse: collapse; font-size: 12px; }
.cost-table th, .cost-table td { padding: 8px 4px; border-bottom: 1px solid var(--wf-line); text-align: right; }
.cost-table th:first-child, .cost-table td:first-child { text-align: left; }
.cost-table tbody tr:last-child td { border-bottom: 0; }
.cost-link { color: var(--wf-ink); font: inherit; font-weight: 700; background: none; border: 0; padding: 0; text-align: left; text-decoration: underline; }
  /* Duo is the app (no rail): equal panes keep the gap on the fold. */
  @media (width > 500px) and (min-aspect-ratio: 5/8) and (max-aspect-ratio: 8/5) and ((width <= 700px) or (height <= 700px)) {
    :root:not([data-posture]) .wf-panes { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  }
</style>
</head>
<body>
<div class="wf-screen">
  <!-- shell: full sidebar on desktop, icon rail on tablet; on iPhone Duo (the app) a bottom tab bar instead: the dock, or the sheet's first row half folded -->
  <nav class="wf-side" data-shell>
    <span class="wf-btn" data-to="home"><i class="wf-ico"></i><span class="wf-lbl">홈</span></span>
    <span class="wf-btn" data-to="agents"><i class="wf-ico"></i><span class="wf-lbl">에이전트</span></span>
    <span class="wf-btn" data-to="decide" data-slot="nav" data-plugin="decisions"><i class="wf-ico"></i><span class="wf-lbl">결정</span><span class="wf-tag hot">3</span></span>
    <span class="wf-btn" data-to="worktrees" data-slot="nav" data-plugin="qa-review"><i class="wf-ico"></i><span class="wf-lbl">리뷰</span></span>
    <span class="wf-btn" data-to="tests" data-slot="nav" data-plugin="tests"><i class="wf-ico"></i><span class="wf-lbl">테스트</span></span>
    <p class="wf-t wf-hide-tablet wf-hide-fold">도구</p>
    <span class="wf-btn wf-hide-tablet wf-hide-fold" data-to="projects"><span class="wf-lbl">프로젝트</span></span>
    <span class="wf-btn wf-hide-tablet wf-hide-fold" data-to="designs"><span class="wf-lbl">설계문서</span></span>
    <span class="wf-btn wf-hide-tablet wf-hide-fold" data-to="trees"><span class="wf-lbl">워크트리</span></span>
    <span class="wf-btn wf-hide-tablet wf-hide-fold" data-to="devices"><span class="wf-lbl">실기기</span></span>
    <span class="wf-btn wf-hide-tablet wf-hide-fold" data-to="media"><span class="wf-lbl">녹화 영상</span></span>
    <span class="wf-btn wf-hide-tablet wf-hide-fold on" data-to="more"><span class="wf-lbl">더 보기</span></span>
    <span class="wf-btn wf-only-tablet wf-only-fold on" data-to="more"><i class="wf-ico"></i></span>
    <span class="wf-grow"></span>
    <span class="wf-btn" data-to="new-agent"><i class="wf-ico"></i><span class="wf-lbl">새 에이전트</span></span>
    <span class="wf-btn" data-to="settings"><span class="wf-dot ok"></span><span class="wf-lbl">설정</span></span>
  </nav>
  <main class="wf-main" data-slot="screen" data-plugin="cost">
    <h1 class="wf-h l">비교 · 비용</h1>
    <div class="wf-panes">
      <div class="wf-col">
        <div class="wf-hide-posture">
          <div class="wire-filters">
            <label class="wire-filter"><span class="wf-t">기간</span><select class="wf-input">
              <option>오늘</option>
              <option>최근 7일</option>
              <option>최근 30일</option>
            </select></label>
            <label class="wire-filter"><span class="wf-t">서버</span><select class="wf-input">
              <option>모든 서버</option>
              <option>서버 A</option>
              <option>서버 B</option>
            </select></label>
          </div>
        </div>
        <section class="wf-box" aria-labelledby="cost-total">
          <h2 class="wf-h" id="cost-total">기간 합계</h2>
          <div class="wf-row"><span class="wf-num">$0.00</span><span>0,000 토큰</span></div>
        </section>
        <section class="wf-box" aria-labelledby="cost-hourly">
          <h2 class="wf-h" id="cost-hourly">시간대별 비용</h2>
          <div class="cost-bars" role="img" aria-label="시간대별 비용 막대 자리">
            <div class="cost-bin"><span class="cost-bar" style="--height:24px"></span><span class="wf-t">00시</span></div>
            <div class="cost-bin"><span class="cost-bar" style="--height:42px"></span><span class="wf-t">06시</span></div>
            <div class="cost-bin"><span class="cost-bar" style="--height:74px"></span><span class="wf-t">12시</span></div>
            <div class="cost-bin"><span class="cost-bar" style="--height:53px"></span><span class="wf-t">18시</span></div>
          </div>
        </section>
      </div>
      <section class="wf-box" aria-labelledby="cost-sessions">
        <h2 class="wf-h" id="cost-sessions">세션별 비용</h2>
        <table class="cost-table" aria-labelledby="cost-sessions">
          <thead><tr><th scope="col">세션 · 서버</th><th scope="col">토큰</th><th scope="col">비용</th></tr></thead>
          <tbody>
            <tr><td><button class="cost-link" type="button" data-to="session">세션 제목 A</button><p class="wf-t">서버 A</p></td><td>0,000</td><td>$0.00</td></tr>
            <tr><td><button class="cost-link" type="button" data-to="session">세션 제목 B</button><p class="wf-t">서버 B</p></td><td>0,000</td><td>$0.00</td></tr>
          </tbody>
        </table>
      </section>
    </div>
    <p class="wf-note">합계와 추이를 먼저 보고 세션 표에서 내역을 확인한다. 넓은 폭은 표를 옆에, 반접힘은 기간·서버 선택을 시트에 둔다.</p>
  </main>
</div>
<!-- iPhone Duo (the app): bottom tab bar -->
<nav class="wf-dock" data-shell>
  <span class="wf-btn" data-to="home">홈</span><span class="wf-btn" data-to="agents">에이전트</span><span class="wf-btn" data-to="decide" data-slot="nav" data-plugin="decisions">결정<span class="wf-tag hot">3</span></span><span class="wf-btn" data-to="tests">테스트</span><span class="wf-btn on" data-to="more">더 보기</span>
</nav>
<!-- half folded: the second half is the sheet: this screen's secondary controls, with the tab bar (its first row) at the bottom -->
<aside class="wf-half">
  <div class="wf-row" data-shell><span class="wf-btn" data-to="home">홈</span><span class="wf-btn" data-to="agents">에이전트</span><span class="wf-btn" data-to="decide" data-slot="nav" data-plugin="decisions">결정<span class="wf-tag hot">3</span></span><span class="wf-btn" data-to="tests">테스트</span><span class="wf-btn on" data-to="more">더 보기</span></div>
  <div class="wf-col" data-slot="screen" data-plugin="cost">
    <section class="wf-box">
      <h2 class="wf-h">기간 · 서버</h2>
      <div class="wire-filters">
        <label class="wire-filter"><span class="wf-t">기간</span><select class="wf-input">
          <option>오늘</option>
          <option>최근 7일</option>
          <option>최근 30일</option>
        </select></label>
        <label class="wire-filter"><span class="wf-t">서버</span><select class="wf-input">
          <option>모든 서버</option>
          <option>서버 A</option>
          <option>서버 B</option>
        </select></label>
      </div>
    </section>
  </div>
</aside>
</body>
</html>
