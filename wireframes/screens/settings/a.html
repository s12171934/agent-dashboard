<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>설정 · 메트릭 서버 · 와이어프레임</title>
<!-- Plugin-filled areas carry data-slot="<slot>" data-plugin="<plugin id>" (FLOW.md 「컨셉」); the core's own parts carry none.
     Copy this file to screens/<screen id>/<variant>.html (a.html, b.html …). Only wf.css and wf.js, nothing else, no real data.
     Keep the shell (sidebar · dock · half sheet) as it is: mark the current screen with class "on" and change only <main> and the sheet's lower part. -->
<link rel="stylesheet" href="../../wf.css">
<script src="../../wf.js"></script>
<style>
.screen-overlay { position: relative; isolation: isolate; }
.overlay-underlay {
  position: absolute; z-index: -1; inset: 0; overflow: hidden; padding: 18px;
  opacity: .48; filter: blur(2px); pointer-events: none;
}
.overlay-underlay .wf-fill { min-height: 156px; }
.overlay-panel {
  position: relative; width: min(var(--overlay-width, 560px), 100%); margin: min(5vh, 40px) auto 0;
  max-height: calc(95vh - 36px); overflow: auto; overscroll-behavior: contain;
}
.overlay-panel > * { min-width: 0; }
.overlay-heading { gap: 8px; }
.overlay-panel .wf-note { margin: 0; }
@media (width <= 500px) {
  .screen-overlay { z-index: 1; }
  .overlay-panel {
    position: fixed; inset: 0; z-index: 2; width: 100%; max-height: none; margin: 0;
    border: 0; border-radius: 0; padding: 12px;
  }
}
:root[data-posture] .overlay-panel { margin: 0 auto; }
:root[data-posture=book] .overlay-panel { max-height: calc(100vh - 36px); }
:root[data-posture=laptop] .overlay-panel { max-height: calc(50vh - 36px); }

.setting-choices { min-width: 0; border: 0; margin: 0; padding: 0; }
.setting-choices legend { padding: 0; margin-bottom: 6px; }
.setting-choices .wf-row, .settings-server { gap: 6px; }
.setting-choices input, .settings-server input, .plugin-setting input[type=checkbox] { accent-color: var(--wf-ink); margin: 0; flex: none; }
.settings-server > div { min-width: 0; }
.settings-fields, .plugin-setting label { gap: 8px; }
.settings-fields label, .plugin-setting label { display: grid; gap: 4px; min-width: 0; }
.settings-fields .wf-input, .plugin-setting .wf-input { min-width: 0; width: 100%; }
.plugin-setting label.wf-row { display: flex; }
.plugin-setting-list { gap: 8px; }
</style>
</head>
<body>
<div class="wf-screen">
  <!-- shell: full sidebar on desktop, icon rail on tablet; on iPhone Duo (the app) a bottom tab bar instead: the dock, or the sheet's first row half folded -->
  <nav class="wf-side" data-shell>
    <span class="wf-btn" data-to="home"><i class="wf-ico"></i><span class="wf-lbl">홈</span></span>
    <span class="wf-btn" data-to="agents"><i class="wf-ico"></i><span class="wf-lbl">에이전트</span></span>
    <span class="wf-btn" data-to="decide" data-slot="nav" data-plugin="decisions"><i class="wf-ico"></i><span class="wf-lbl">결정</span><span class="wf-tag hot">3</span></span>
    <span class="wf-btn" data-to="worktrees" data-slot="nav" data-plugin="qa-review"><i class="wf-ico"></i><span class="wf-lbl">리뷰</span></span>
    <span class="wf-btn" data-to="tests" data-slot="nav" data-plugin="tests"><i class="wf-ico"></i><span class="wf-lbl">테스트</span></span>
    <p class="wf-t wf-hide-tablet wf-hide-fold">도구</p>
    <span class="wf-btn wf-hide-tablet wf-hide-fold" data-to="projects"><span class="wf-lbl">프로젝트</span></span>
    <span class="wf-btn wf-hide-tablet wf-hide-fold" data-to="designs"><span class="wf-lbl">설계문서</span></span>
    <span class="wf-btn wf-hide-tablet wf-hide-fold" data-to="trees"><span class="wf-lbl">워크트리</span></span>
    <span class="wf-btn wf-hide-tablet wf-hide-fold" data-to="devices"><span class="wf-lbl">실기기</span></span>
    <span class="wf-btn wf-hide-tablet wf-hide-fold" data-to="media"><span class="wf-lbl">녹화 영상</span></span>
    <span class="wf-btn wf-hide-tablet wf-hide-fold" data-to="more"><span class="wf-lbl">더 보기</span></span>
    <span class="wf-btn wf-only-tablet wf-only-fold" data-to="more"><i class="wf-ico"></i></span>
    <span class="wf-grow"></span>
    <span class="wf-btn" data-to="new-agent"><i class="wf-ico"></i><span class="wf-lbl">새 에이전트</span></span>
    <span class="wf-btn on" data-to="settings"><span class="wf-dot ok"></span><span class="wf-lbl">설정</span></span>
  </nav>
  <main class="wf-main screen-overlay">
    <div class="wf-col overlay-underlay" aria-hidden="true">
      <div class="wf-line s"></div>
      <div class="wf-panes">
        <div class="wf-col"><div class="wf-fill"></div><div class="wf-fill"></div></div>
        <div class="wf-col"><div class="wf-fill"></div><div class="wf-fill"></div></div>
      </div>
    </div>
    <section class="wf-dialog wf-col overlay-panel" role="dialog" aria-labelledby="settings-title">
      <header class="wf-row overlay-heading">
        <h1 class="wf-h l wf-grow" id="settings-title">설정</h1>
        <button type="button" class="wf-btn wf-hide-posture" data-to="plugins">플러그인 관리</button>
        <button type="button" class="wf-btn" data-to="home">닫기</button>
      </header>
      <section class="wf-box" aria-labelledby="metrics-title">
        <div class="wf-row">
          <h2 class="wf-h wf-grow" id="metrics-title">메트릭 서버</h2>
          <span class="wf-tag">1대 연결</span>
        </div>
        <div class="wf-list">
          <div class="settings-server">
            <span class="wf-dot ok" aria-hidden="true"></span>
            <div class="wf-grow"><strong>메트릭 서버 A</strong><p class="wf-t">서버 주소 · 연결됨</p></div>
            <label class="wf-btn"><input type="checkbox" aria-label="메트릭 서버 A 사용" checked>사용</label>
          </div>
          <div class="settings-server">
            <span class="wf-dot bad" aria-hidden="true"></span>
            <div class="wf-grow"><strong>메트릭 서버 B</strong><p class="wf-t">서버 주소 · 연결 끊김</p></div>
            <label class="wf-btn"><input type="checkbox" aria-label="메트릭 서버 B 사용" checked>사용</label>
          </div>
        </div>
        <div class="wf-hide-posture">
          <fieldset class="setting-choices">
            <legend class="wf-t">서버 보기</legend>
            <div class="wf-row">
              <label class="wf-btn"><input type="radio" name="server-view" checked>합쳐 보기</label>
              <label class="wf-btn"><input type="radio" name="server-view">서버별 보기</label>
            </div>
          </fieldset>
        </div>
      </section>
      <section class="wf-box settings-fields" aria-labelledby="appearance-title">
        <h2 class="wf-h" id="appearance-title">화면 표시</h2>
        <label>내비게이션 위치
          <select class="wf-input"><option>기기 기본값</option><option>아래 독</option><option>왼쪽 사이드바</option></select>
        </label>
        <label>테마
          <select class="wf-input"><option>시스템</option><option>밝게</option><option>어둡게</option></select>
        </label>
      </section>
      <section class="wf-col plugin-setting-list" aria-labelledby="plugin-settings-title">
        <h2 class="wf-h" id="plugin-settings-title">플러그인 설정</h2>
        <div class="wf-box plugin-setting" data-slot="settings" data-plugin="decisions">
          <h3 class="wf-h">결정</h3>
          <label class="wf-row"><input type="checkbox">메일함 모드</label>
        </div>
        <div class="wf-box plugin-setting" data-slot="settings" data-plugin="qa-review">
          <h3 class="wf-h">QA 리뷰</h3>
          <label>QA 묶음 <select class="wf-input"><option>QA 묶음 이름</option></select></label>
        </div>
        <div class="wf-box plugin-setting" data-slot="settings" data-plugin="designs">
          <h3 class="wf-h">설계문서</h3>
          <label>설계문서 폴더 <input class="wf-input" type="text" placeholder="폴더 경로"></label>
        </div>
        <div class="wf-box plugin-setting" data-slot="settings" data-plugin="worktrees">
          <h3 class="wf-h">워크트리</h3>
          <label>에디터 <select class="wf-input"><option>에디터 이름</option></select></label>
        </div>
      </section>
      <p class="wf-note">연결 상태와 화면 표시를 먼저 확인한다. 반접힘의 보조 시트에는 서버 보기 방식과 플러그인 관리 바로가기를 둔다.</p>
    </section>
  </main>
</div>
<!-- iPhone Duo (the app): bottom tab bar -->
<nav class="wf-dock" data-shell>
  <span class="wf-btn" data-to="home">홈</span><span class="wf-btn" data-to="agents">에이전트</span><span class="wf-btn" data-to="decide" data-slot="nav" data-plugin="decisions">결정<span class="wf-tag hot">3</span></span><span class="wf-btn" data-to="tests">테스트</span><span class="wf-btn" data-to="more">더 보기</span>
</nav>
<!-- half folded: the second half is the sheet: this screen's secondary controls, with the tab bar (its first row) at the bottom -->
<aside class="wf-half">
  <div class="wf-row" data-shell><span class="wf-btn" data-to="home">홈</span><span class="wf-btn" data-to="agents">에이전트</span><span class="wf-btn" data-to="decide" data-slot="nav" data-plugin="decisions">결정<span class="wf-tag hot">3</span></span><span class="wf-btn" data-to="tests">테스트</span><span class="wf-btn" data-to="more">더 보기</span></div>
  <section class="wf-box">
    <div class="wf-row">
      <h2 class="wf-h wf-grow">메트릭 서버</h2>
      <button type="button" class="wf-btn" data-to="plugins">플러그인 관리</button>
    </div>
    <fieldset class="setting-choices">
      <legend class="wf-t">서버 보기</legend>
      <div class="wf-row">
        <label class="wf-btn"><input type="radio" name="server-view-sheet" checked>합쳐 보기</label>
        <label class="wf-btn"><input type="radio" name="server-view-sheet">서버별 보기</label>
      </div>
    </fieldset>
  </section>
</aside>
</body>
</html>
