<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>홈 · 와이어프레임</title>
<!-- Plugin-filled areas carry data-slot="<slot>" data-plugin="<plugin id>" (FLOW.md 「컨셉」); the core's own parts carry none.
     Copy this file to screens/<screen id>/<variant>.html (a.html, b.html …). Only wf.css and wf.js, nothing else, no real data.
     Keep the shell (sidebar · dock · half sheet) as it is: mark the current screen with class "on" and change only <main> and the sheet's lower part. -->
<link rel="stylesheet" href="../../wf.css">
<script src="../../wf.js"></script>
<style>
.home-layout > *, .home-tools > * { min-width: 0; }
.home-inbox-row, .home-utility {
  width: 100%; min-height: 44px; border: 0; background: transparent; color: inherit;
  font: inherit; text-align: left; cursor: pointer;
}
.home-inbox-row { justify-content: space-between; }
.home-tools-list { display: grid; gap: 8px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
.home-utility {
  display: flex; flex-direction: column; justify-content: center; align-items: flex-start; gap: 2px;
  padding: 8px; border: 1px solid var(--wf-line); border-radius: var(--wf-r); background: var(--wf-panel);
}
.home-tools-layout { grid-column: 1 / -1; }
.home-summary button { align-self: flex-start; }
.home-progress { min-height: 9px; display: block; overflow: hidden; }
.home-progress::before { content: ""; display: block; width: 60%; height: 9px; background: var(--wf-muted); }
.home-pipeline { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px 12px; }
.home-pipeline span { white-space: nowrap; }
@media (width <= 500px) {
  .home-tools-list { grid-template-columns: minmax(0, 1fr); }
}
@media (width > 500px) and (min-aspect-ratio: 5/8) and (max-aspect-ratio: 8/5) and ((width <= 700px) or (height <= 700px)) {
  :root:not([data-posture]) .home-layout { grid-template-columns: minmax(0, calc(50% - 46px)) minmax(0, 1fr); }
  .home-tools-list { grid-template-columns: minmax(0, calc(50% - 42px)) minmax(0, 1fr); column-gap: 28px; }
}
@media (width > 1100px) {
  .home-layout { grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr) minmax(0, 1fr); }
  .home-tools-layout { grid-column: auto; }
}
:root[data-posture] .home-tools-list { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
</style>
</head>
<body>
<div class="wf-screen">
  <!-- shell: full sidebar on desktop, icon rail on tablet and unfolded Duo, hidden on the cover (dock) and half folded (sheet) -->
  <nav class="wf-side" data-shell>
    <span class="wf-btn on" data-to="home"><i class="wf-ico"></i><span class="wf-lbl">홈</span></span>
    <span class="wf-btn" data-to="agents"><i class="wf-ico"></i><span class="wf-lbl">에이전트</span></span>
    <span class="wf-btn" data-to="decide" data-slot="nav" data-plugin="decisions"><i class="wf-ico"></i><span class="wf-lbl">결정</span><span class="wf-tag hot">3</span></span>
    <span class="wf-btn" data-to="worktrees" data-slot="nav" data-plugin="qa-review"><i class="wf-ico"></i><span class="wf-lbl">리뷰</span></span>
    <span class="wf-btn" data-to="tests" data-slot="nav" data-plugin="tests"><i class="wf-ico"></i><span class="wf-lbl">테스트</span></span>
    <p class="wf-t wf-hide-tablet wf-hide-fold">도구</p>
    <span class="wf-btn wf-hide-tablet wf-hide-fold" data-to="projects"><span class="wf-lbl">프로젝트</span></span>
    <span class="wf-btn wf-hide-tablet wf-hide-fold" data-to="designs"><span class="wf-lbl">설계문서</span></span>
    <span class="wf-btn wf-hide-tablet wf-hide-fold" data-to="trees"><span class="wf-lbl">워크트리</span></span>
    <span class="wf-btn wf-hide-tablet wf-hide-fold" data-to="devices"><span class="wf-lbl">실기기</span></span>
    <span class="wf-btn wf-hide-tablet wf-hide-fold" data-to="media"><span class="wf-lbl">녹화 영상</span></span>
    <span class="wf-btn wf-hide-tablet wf-hide-fold" data-to="more"><span class="wf-lbl">더 보기</span></span>
    <span class="wf-btn wf-only-tablet wf-only-fold" data-to="more"><i class="wf-ico"></i></span>
    <span class="wf-grow"></span>
    <span class="wf-btn" data-to="new-agent"><i class="wf-ico"></i><span class="wf-lbl">새 에이전트</span></span>
    <span class="wf-btn" data-to="settings"><span class="wf-dot ok"></span><span class="wf-lbl">설정</span></span>
  </nav>
  <main class="wf-main">
    <header class="wf-row">
      <h1 class="wf-h l wf-grow">홈</h1>
      <button type="button" class="wf-btn primary wf-hide-posture" data-to="new-agent">+ 새 에이전트</button>
    </header>
    <div class="wf-panes home-layout">
      <section class="wf-box" aria-labelledby="home-inbox-title">
        <h2 class="wf-h" id="home-inbox-title">내 차례</h2>
        <div class="wf-list">
          <button type="button" class="home-inbox-row" data-to="decide" data-slot="inbox" data-plugin="decisions"><strong class="wf-grow">결정 대기</strong><span class="wf-tag hot">3건</span><span aria-hidden="true">›</span></button>
          <button type="button" class="home-inbox-row" data-to="decide" data-slot="inbox" data-plugin="decisions"><strong class="wf-grow">보고 확인</strong><span class="wf-tag">2건</span><span aria-hidden="true">›</span></button>
          <button type="button" class="home-inbox-row" data-to="worktrees" data-slot="inbox" data-plugin="qa-review"><strong class="wf-grow">반출 승인</strong><span class="wf-tag hot">1건</span><span aria-hidden="true">›</span></button>
          <button type="button" class="home-inbox-row" data-to="worktrees" data-slot="inbox" data-plugin="qa-review"><strong class="wf-grow">막힘</strong><span class="wf-tag bad">1건</span><span aria-hidden="true">›</span></button>
        </div>
      </section>
      <section class="wf-col home-summary" aria-labelledby="home-progress-title">
        <h2 class="wf-h" id="home-progress-title">진행 요약</h2>
        <div class="wf-box" data-to="agents" tabindex="0" role="link">
          <div class="wf-row"><strong class="wf-grow">실행 중 에이전트</strong><span class="wf-tag">6개</span></div>
        </div>
        <div class="wf-box" data-to="tests" data-slot="home.tile" data-plugin="tests" tabindex="0" role="link">
          <div class="wf-row"><strong class="wf-grow">실행 중 테스트</strong><span class="wf-tag">2건</span></div>
          <p class="wf-t">테스트 이름 · 12 / 20</p>
          <div class="wf-fill home-progress" role="progressbar" aria-label="테스트 진행" aria-valuemin="0" aria-valuemax="20" aria-valuenow="12"></div>
        </div>
        <div class="wf-box" data-to="worktrees" data-slot="home.tile" data-plugin="qa-review" tabindex="0" role="link">
          <strong>QA 파이프라인</strong>
          <div class="home-pipeline">
            <span>막힘 <b class="wf-tag bad">1</b></span><span>승인 대기 <b class="wf-tag hot">1</b></span>
            <span>작업 중 <b class="wf-tag">4</b></span><span>대기 <b class="wf-tag">2</b></span>
          </div>
        </div>
      </section>
      <section class="wf-col home-tools-layout wf-hide-posture" aria-labelledby="home-tools-title">
        <h2 class="wf-h" id="home-tools-title">도구 요약</h2>
        <div class="home-tools-list">
          <button type="button" class="home-utility" data-to="compare" data-slot="home.tile" data-plugin="cost"><strong>비교 · 비용</strong><span class="wf-t">오늘 0.00</span></button>
          <button type="button" class="home-utility" data-to="usage" data-slot="home.tile" data-plugin="plan-usage"><strong>플랜 사용량</strong><span class="wf-t">최고 60%</span></button>
          <button type="button" class="home-utility" data-to="projects" data-slot="home.tile" data-plugin="projects"><strong>프로젝트</strong><span class="wf-t">진행 중 2개</span></button>
          <button type="button" class="home-utility" data-to="designs" data-slot="home.tile" data-plugin="designs"><strong>설계문서</strong><span class="wf-t">최근 참조 3건</span></button>
        </div>
      </section>
    </div>
    <p class="wf-note">접힘에서는 내 차례에서 진행 요약으로 내려간다. 펼침과 태블릿에서는 둘을 옆에 두고, 데스크톱에서는 도구 요약까지 나란히 본다.</p>
  </main>
</div>
<!-- Duo cover: bottom dock -->
<nav class="wf-dock" data-shell>
  <span class="wf-btn on" data-to="home">홈</span><span class="wf-btn" data-to="agents">에이전트</span><span class="wf-btn" data-to="decide" data-slot="nav" data-plugin="decisions">결정<span class="wf-tag hot">3</span></span><span class="wf-btn" data-to="tests">테스트</span><span class="wf-btn" data-to="more">더 보기</span>
</nav>
<!-- half folded: the second half is the dock's sheet: navigation on top, then this screen's secondary controls -->
<aside class="wf-half">
  <div class="wf-row" data-shell><span class="wf-btn on" data-to="home">홈</span><span class="wf-btn" data-to="agents">에이전트</span><span class="wf-btn" data-to="decide" data-slot="nav" data-plugin="decisions">결정<span class="wf-tag hot">3</span></span><span class="wf-btn" data-to="tests">테스트</span><span class="wf-btn" data-to="more">더 보기</span></div>
  <section class="wf-col" aria-labelledby="home-sheet-title">
    <div class="wf-row">
      <h2 class="wf-h wf-grow" id="home-sheet-title">도구 요약</h2>
      <button type="button" class="wf-btn primary" data-to="new-agent">+ 새 에이전트</button>
    </div>
    <div class="home-tools-list">
    <button type="button" class="home-utility" data-to="compare" data-slot="home.tile" data-plugin="cost"><strong>비교 · 비용</strong><span class="wf-t">오늘 0.00</span></button>
    <button type="button" class="home-utility" data-to="usage" data-slot="home.tile" data-plugin="plan-usage"><strong>플랜 사용량</strong><span class="wf-t">최고 60%</span></button>
    <button type="button" class="home-utility" data-to="projects" data-slot="home.tile" data-plugin="projects"><strong>프로젝트</strong><span class="wf-t">진행 중 2개</span></button>
    <button type="button" class="home-utility" data-to="designs" data-slot="home.tile" data-plugin="designs"><strong>설계문서</strong><span class="wf-t">최근 참조 3건</span></button>
    </div>
  </section>
</aside>
</body>
</html>
