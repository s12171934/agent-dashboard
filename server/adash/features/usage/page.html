<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>기능 사용 분석</title>
<!-- Served by the metrics server at /usage (adash/features/usage/api.py); reads /api/usage/report on the same address.
     The same tallies as server/ausage. Self-contained: the server serves no other page files. -->
<style>
  :root { color-scheme: light dark;
    --bg: #f6f7f9; --card: #fff; --ink: #1d2330; --muted: #6b7385; --line: #e3e6ec; --accent: #3b6fe0; --heat: 59, 111, 224; --warn: #b7791f; }
  @media (prefers-color-scheme: dark) { :root {
    --bg: #12151b; --card: #1b1f27; --ink: #e6e9ef; --muted: #8d95a7; --line: #2b313c; --accent: #7aa2ff; --heat: 122, 162, 255; --warn: #e0a84a; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Segoe UI", sans-serif; }
  main { max-width: 1200px; margin: 0 auto; padding: 20px 16px 48px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  h2 { font-size: 15px; margin: 28px 0 10px; }
  .sub { color: var(--muted); font-size: 12px; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; margin: 14px 0 4px; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--card); }
  .seg button { border: 0; background: none; color: var(--ink); padding: 5px 10px; font: inherit; cursor: pointer; }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button.on { background: var(--accent); color: #fff; }
  label { display: inline-flex; gap: 6px; align-items: center; color: var(--muted); }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; min-width: 0; }
  .card b { display: block; font-size: 13px; margin-bottom: 6px; overflow-wrap: anywhere; }
  .kpi { display: flex; gap: 14px; }
  .kpi div { font-size: 18px; font-weight: 600; }
  .kpi small { display: block; font-size: 11px; color: var(--muted); font-weight: 400; }
  .scroll { overflow-x: auto; background: var(--card); border: 1px solid var(--line); border-radius: 10px; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { padding: 6px 10px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
  th { color: var(--muted); font-weight: 500; font-size: 12px; }
  tr:last-child td { border-bottom: 0; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  td.none { color: var(--muted); }
  td.wrap { white-space: normal; overflow-wrap: anywhere; min-width: 200px; }
  .tops { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 10px; }
  .feat { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; padding: 5px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
  .feat:last-child { border-bottom: 0; }
  .feat span { overflow-wrap: anywhere; }
  .feat em { font-style: normal; color: var(--muted); font-variant-numeric: tabular-nums; }
  .feat i { grid-column: 1 / -1; height: 4px; border-radius: 2px; background: var(--accent); opacity: .7; }
  .empty { color: var(--muted); padding: 10px 0; }
  .err { color: var(--warn); }
  code { font-size: 12px; }
</style>
</head>
<body>
<main>
  <h1>기능 사용 분석</h1>
  <div class="sub" id="meta">불러오는 중…</div>
  <div class="bar">
    <span class="seg" id="days"><button data-k="1">1일</button><button data-k="7">7일</button><button data-k="30">30일</button><button data-k="0">전체</button></span>
    <span class="seg" id="by"><button data-k="both">앱 · 화면 폭</button><button data-k="app">앱</button><button data-k="form">화면 폭</button></span>
    <span class="seg" id="rare" title="이 횟수 이하면 「거의 안 씀」"><button data-k="1">≤1회</button><button data-k="2">≤2회</button><button data-k="3">≤3회</button></span>
    <label><input type="checkbox" id="live" checked> 10초마다 새로고침</label>
  </div>
  <div id="out"></div>
</main>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const opt = (() => { try { return { days: '30', by: 'both', rare: '1', ...JSON.parse(localStorage.getItem('usage.opt') || '{}') }; } catch { return { days: '30', by: 'both', rare: '1' }; } })();
const VIEW = { home: '홈', agents: '에이전트', session: '세션 상세', run: 'Run 상세', driver: '드라이버', compare: '비교', talk: '대화', tests: '테스트',
  worktrees: 'QA·워크트리 리뷰', trees: '워크트리', decide: '결정 대기', chars: '캐릭터', usage: '플랜 사용량', projects: '프로젝트', designs: '설계문서' };
const vname = v => VIEW[v] ? `${VIEW[v]} <span class="sub">${esc(v)}</span>` : esc(v);
const dur = s => s < 60 ? `${s}초` : s < 3600 ? `${Math.round(s / 60)}분` : `${Math.floor(s / 3600)}시간 ${Math.round(s % 3600 / 60)}분`;
const when = ts => { const d = new Date(ts), z = n => String(n).padStart(2, '0');
  return `${d.getMonth() + 1}/${d.getDate()} ${z(d.getHours())}:${z(d.getMinutes())}:${z(d.getSeconds())}`; };
const pct = x => `${Math.round(x * 100)}%`;

for (const id of ['days', 'by', 'rare']) {
  $('#' + id).addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    opt[id] = b.dataset.k; try { localStorage.setItem('usage.opt', JSON.stringify(opt)); } catch {}
    load();
  });
}

async function load() {
  for (const id of ['days', 'by', 'rare']) $('#' + id).querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.k === opt[id]));
  let d;
  try {
    const res = await fetch(`/api/usage/report?days=${opt.days}&by=${opt.by}&rare=${opt.rare}&top=15`);
    d = await res.json();
    if (!res.ok) throw new Error(d.error || res.status);
  } catch (e) { $('#meta').innerHTML = `<span class="err">불러오지 못했습니다: ${esc(e.message || e)}</span>`; return; }
  $('#meta').textContent = `${opt.days === '0' ? '전체 기간' : `최근 ${opt.days}일`} · 기록 ${d.rows}건 · ${new Date().toLocaleTimeString()} 기준`;
  if (!d.log) return $('#out').innerHTML = `<p class="empty">아직 기록이 없습니다. 대시보드를 열고 쓰면 30초 안에, 또는 탭을 숨길 때 <code>server/usage.jsonl</code> 에 쌓입니다.</p>`;
  if (!d.rows) return $('#out').innerHTML = `<p class="empty">이 기간에는 기록이 없습니다.</p>`;
  const envs = d.envs.map(x => x.env);
  const maxShare = Math.max(...d.screens.flatMap(s => envs.map(e => s[e].share)), 0.01);
  $('#out').innerHTML = `
    <h2>환경</h2>
    <div class="cards">${d.envs.map(x => `<div class="card"><b>${esc(x.env)}</b><div class="kpi">
      <div>${x.devices}<small>기기</small></div><div>${x.clicks}<small>클릭</small></div><div>${dur(x.screen_secs)}<small>화면 시간</small></div></div></div>`).join('')}</div>

    <h2>화면 — 연 횟수 · 화면 시간 비율</h2>
    <div class="scroll"><table><tr><th>화면</th>${envs.map(e => `<th>${esc(e)}</th>`).join('')}</tr>
      ${d.screens.map(s => `<tr><td>${vname(s.view)}</td>${envs.map(e => { const c = s[e];
        return c.opens || c.secs ? `<td class="num" style="background: rgba(var(--heat), ${(0.08 + 0.5 * c.share / maxShare).toFixed(2)})">${c.opens}회 · ${pct(c.share)}</td>` : '<td class="num none">–</td>'; }).join('')}</tr>`).join('')}
    </table></div>

    <h2>많이 쓰는 기능</h2>
    <div class="tops">${envs.map(e => { const list = d.top[e], max = list[0]?.[1] || 1, total = d.envs.find(x => x.env === e).clicks || 1;
      return `<div class="card"><b>${esc(e)}</b>${list.length ? list.map(([f, n]) => `<div class="feat"><span>${esc(f)}</span><em>${n}회 · ${pct(n / total)}</em><i style="width:${(100 * n / max).toFixed(1)}%"></i></div>`).join('') : '<div class="empty">클릭 없음</div>'}</div>`; }).join('')}</div>

    <h2>다른 환경에선 쓰는데 여기선 거의 안 쓰는 기능 <span class="sub">여기 ≤${opt.rare}회, 다른 환경 ≥3회</span></h2>
    ${(() => { const rows = envs.flatMap(e => d.rare_here[e].map(([f, n, m]) => `<tr><td>${esc(e)}</td><td class="wrap">${esc(f)}</td><td class="num">${n}</td><td class="num">${m}</td></tr>`));
      return rows.length ? `<div class="scroll"><table><tr><th>환경</th><th>기능</th><th>여기</th><th>다른 환경</th></tr>${rows.join('')}</table></div>` : '<p class="empty">없음 — 기록이 더 쌓이면 나타납니다.</p>'; })()}

    <h2>모든 환경에서 드문 기능 <span class="sub">합계 ≤${opt.rare}회</span></h2>
    ${d.rare_everywhere.length ? `<div class="scroll"><table><tr><th>기능</th><th>횟수</th></tr>${d.rare_everywhere.map(([f, n]) => `<tr><td class="wrap">${esc(f)}</td><td class="num">${n}</td></tr>`).join('')}</table></div>` : '<p class="empty">없음</p>'}

    <h2>최근 기록 <span class="sub">최신 40건</span></h2>
    <div class="scroll"><table><tr><th>시각</th><th>환경</th><th>화면</th><th>기능</th></tr>
      ${d.recent.map(r => `<tr><td>${when(r.ts)}</td><td>${esc(r.env)}</td><td>${esc(r.view)}</td><td class="wrap">${r.feat === 'stay' ? `머문 시간 ${dur(r.secs || 0)}` : r.feat === 'open' ? '화면 열기' : esc(r.feat)}</td></tr>`).join('')}
    </table></div>`;
}
load();
setInterval(() => { if ($('#live').checked && !document.hidden) load(); }, 10000);
</script>
</body>
</html>
