<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f5f7">
<title>Agent Dashboard</title>
<script>
// Colour theme: adash.theme = system | light | dark, per device. Resolved before the stylesheet paints, so a dark
// choice never flashes light; 「시스템」 keeps following the OS while the page is open.
// adash.theme.custom = {light: {"--accent": "#…", …}, dark: {…}}: the user's colours over the built-in palette of
// that base, set inline on <html> (they beat the stylesheet's :root rules).
(() => {
  const os = matchMedia('(prefers-color-scheme: dark)');
  const read = (k, d) => { try { return localStorage.getItem(k) || d; } catch { return d; } };
  let applied = [];
  window.themeCustom = () => { try { return JSON.parse(read('adash.theme.custom', '{}')) || {}; } catch { return {}; } };
  window.applyTheme = (choice = read('adash.theme', 'system')) => {
    const dark = choice === 'dark' || (choice === 'system' && os.matches), base = dark ? 'dark' : 'light', root = document.documentElement;
    root.dataset.theme = base;
    applied.forEach(v => root.style.removeProperty(v));
    const own = themeCustom()[base] || {};
    applied = Object.keys(own).filter(v => v.startsWith('--'));
    applied.forEach(v => root.style.setProperty(v, own[v]));
    document.querySelector('meta[name=theme-color]')?.setAttribute('content', own['--bg'] || (dark ? '#0f1215' : '#f4f5f7'));
    return base;
  };
  os.addEventListener('change', () => applyTheme());
  applyTheme();
})();
</script>
<link rel="stylesheet" href="app.css">
</head>
<body>
<header>
  <div class="hrow">
    <h1>Agent Dashboard</h1>
    <div class="kpis-h">
      <div class="stat"><b id="k-live">–</b><span>실행 중</span></div>
      <div class="stat" id="k-bg-wrap" hidden><b id="k-bg">0</b><span>백그라운드</span></div>
      <div class="stat"><b id="k-agents">–</b><span>에이전트</span></div>
      <div class="stat"><b id="k-cost">–</b><span>추정 비용</span></div>
      <div class="stat"><b id="k-tokens">–</b><span>처리 토큰</span></div>
      <div class="stat"><b id="k-turns">–</b><span>총 턴</span></div>
      <div class="stat"><b id="k-runs">–</b><span>진행 Run</span></div>
      <div class="stat dec" id="k-dec-wrap" hidden><b id="k-dec">0</b><span>결정 대기</span></div>
    </div>
    <div class="conn" id="conn"><i></i><span>연결 중</span></div>
    <div class="health" id="health" hidden></div>
  </div>
  <nav>
    <a href="#agents" data-v="agents">에이전트</a>
    <a href="#compare" data-v="compare">비교</a>
    <a href="#talk" data-v="talk">상호작용</a>
    <a href="#tests" data-v="tests">테스트 <b id="k-tests" hidden>0</b></a>
    <a href="#hidden" data-v="hidden" class="nav-hidden">숨김 <b id="k-hidden">0</b></a>
    <label><input type="checkbox" id="only-live"> 실행 중만</label>
    <label title="Orca 에 연결된 터미널에서 돌고 있는 에이전트(「Orca 에서 열기」가 되는 것)만"><input type="checkbox" id="only-orca"> Orca 에 열린 것만</label>
    <label title="색상 테마 (이 기기에만 저장)">테마 <select id="theme"><option value="system">시스템</option><option value="light">라이트</option><option value="dark">다크</option></select></label>
    <button class="act" id="theme-edit" title="지금 테마(라이트 또는 다크)의 색을 바꿈">색 편집</button>
  </nav>
</header>
<div id="theme-panel" hidden></div>
<div id="decisions" hidden></div>
<main id="view"><div class="empty">불러오는 중…</div></main>
<div class="tip" id="tip"></div>
<script src="api.js"></script>
<script src="decision.js"></script>
<script src="app.js"></script>
</body>
</html>
