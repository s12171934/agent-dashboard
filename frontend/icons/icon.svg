<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Agent Dashboard: a 2×2 grid of agent cards, one running, as liquid glass: frosted tiles with a bright rim and a
       top sheen over a deep colour field. Full-bleed square (the OS masks it); the cards stay inside the central 80%
       circle that maskable icons keep. Rendered to the PNGs next to it. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16206b"/>
      <stop offset=".55" stop-color="#2f5fd6"/>
      <stop offset="1" stop-color="#7a4fd8"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="46"/></filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="10"/></filter>
    <filter id="drop" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0a1040" flood-opacity=".35"/></filter>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".55"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".08"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".02"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".95"/>
      <stop offset=".45" stop-color="#fff" stop-opacity=".25"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".6"/>
    </linearGradient>
    <linearGradient id="lit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".95"/>
      <stop offset="1" stop-color="#dfe8ff" stop-opacity=".78"/>
    </linearGradient>
    <g id="tile">
      <rect width="128" height="128" rx="30" fill="url(#sheen)"/>
      <rect x="1.5" y="1.5" width="125" height="125" rx="28.5" fill="none" stroke="url(#rim)" stroke-width="3"/>
    </g>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- colour the glass refracts -->
  <circle cx="150" cy="390" r="120" fill="#2fd39a" opacity=".45" filter="url(#soft)"/>
  <circle cx="390" cy="120" r="110" fill="#ff8a5c" opacity=".35" filter="url(#soft)"/>
  <g filter="url(#drop)">
    <rect x="116" y="116" width="128" height="128" rx="30" fill="url(#lit)"/>
    <rect x="268" y="116" width="128" height="128" rx="30" fill="#ffffff" fill-opacity=".14"/>
    <rect x="116" y="268" width="128" height="128" rx="30" fill="#ffffff" fill-opacity=".14"/>
    <rect x="268" y="268" width="128" height="128" rx="30" fill="#ffffff" fill-opacity=".34"/>
  </g>
  <use href="#tile" x="116" y="116"/>
  <use href="#tile" x="268" y="116"/>
  <use href="#tile" x="116" y="268"/>
  <use href="#tile" x="268" y="268"/>
  <!-- the running agent: a lit dot -->
  <circle cx="332" cy="180" r="30" fill="#3ee08f" filter="url(#glow)" opacity=".9"/>
  <circle cx="332" cy="180" r="24" fill="#4fe39a"/>
  <ellipse cx="332" cy="171" rx="14" ry="8" fill="#fff" opacity=".55"/>
</svg>
