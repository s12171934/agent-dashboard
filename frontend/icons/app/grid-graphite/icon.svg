<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Agent Dashboard app icon grid-graphite, generated by scripts/make-icons.py: full-bleed square (the OS
       masks it). Rendered to the PNGs next to it. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0d10"/>
      <stop offset=".55" stop-color="#262b33"/>
      <stop offset="1" stop-color="#4a515c"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="46"/></filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="10"/></filter>
    <filter id="drop" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity=".35"/></filter>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".55"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".08"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".02"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".95"/>
      <stop offset=".45" stop-color="#fff" stop-opacity=".25"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".6"/>
    </linearGradient>
    <linearGradient id="lit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".95"/>
      <stop offset="1" stop-color="#e6e9ef" stop-opacity=".78"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- colour the glass refracts -->
  <circle cx="150" cy="390" r="120" fill="#6b7cff" opacity=".45" filter="url(#soft)"/>
  <circle cx="390" cy="120" r="110" fill="#2fd39a" opacity=".35" filter="url(#soft)"/>
  <!-- a 2x2 grid of agent cards, one running -->
  <g filter="url(#drop)"><rect x="116" y="116" width="128" height="128" rx="30" fill="url(#lit)"/></g>
  <rect x="116" y="116" width="128" height="128" rx="30" fill="url(#sheen)"/>
  <rect x="116" y="116" width="128" height="128" rx="30" fill="none" stroke="url(#rim)" stroke-width="3"/>
  <g filter="url(#drop)"><rect x="268" y="116" width="128" height="128" rx="30" fill="#ffffff" fill-opacity=".14"/></g>
  <rect x="268" y="116" width="128" height="128" rx="30" fill="url(#sheen)"/>
  <rect x="268" y="116" width="128" height="128" rx="30" fill="none" stroke="url(#rim)" stroke-width="3"/>
  <g filter="url(#drop)"><rect x="116" y="268" width="128" height="128" rx="30" fill="#ffffff" fill-opacity=".14"/></g>
  <rect x="116" y="268" width="128" height="128" rx="30" fill="url(#sheen)"/>
  <rect x="116" y="268" width="128" height="128" rx="30" fill="none" stroke="url(#rim)" stroke-width="3"/>
  <g filter="url(#drop)"><rect x="268" y="268" width="128" height="128" rx="30" fill="#ffffff" fill-opacity=".34"/></g>
  <rect x="268" y="268" width="128" height="128" rx="30" fill="url(#sheen)"/>
  <rect x="268" y="268" width="128" height="128" rx="30" fill="none" stroke="url(#rim)" stroke-width="3"/>
  <circle cx="332" cy="180" r="30" fill="#4fe39a" filter="url(#glow)" opacity=".9"/>
  <circle cx="332" cy="180" r="24" fill="#4fe39a"/>
  <ellipse cx="332" cy="170.88" rx="13.92" ry="8" fill="#fff" opacity=".55"/>
</svg>
