<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Agent Dashboard app icon bot-emerald, generated by scripts/make-icons.py: full-bleed square (the OS
       masks it). Rendered to the PNGs next to it. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#04342a"/>
      <stop offset=".55" stop-color="#0f8a68"/>
      <stop offset="1" stop-color="#3cc4a0"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="46"/></filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="10"/></filter>
    <filter id="drop" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#02241c" flood-opacity=".35"/></filter>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".55"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".08"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".02"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".95"/>
      <stop offset=".45" stop-color="#fff" stop-opacity=".25"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".6"/>
    </linearGradient>
    <linearGradient id="lit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".95"/>
      <stop offset="1" stop-color="#dcfff2" stop-opacity=".78"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- colour the glass refracts -->
  <circle cx="150" cy="390" r="120" fill="#b6f05a" opacity=".45" filter="url(#soft)"/>
  <circle cx="390" cy="120" r="110" fill="#2fa7ff" opacity=".35" filter="url(#soft)"/>
  <!-- an agent's face -->
  <path d="M256 160V122" stroke="#fff" stroke-opacity=".75" stroke-width="10" stroke-linecap="round"/>
  <circle cx="256" cy="108" r="24" fill="#d9ff6b" filter="url(#glow)" opacity=".9"/>
  <circle cx="256" cy="108" r="18" fill="#d9ff6b"/>
  <ellipse cx="256" cy="101.16" rx="10.44" ry="6" fill="#fff" opacity=".55"/>
  <g filter="url(#drop)"><rect x="98" y="230" width="34" height="80" rx="14" fill="#ffffff" fill-opacity=".16"/></g>
  <rect x="98" y="230" width="34" height="80" rx="14" fill="url(#sheen)"/>
  <rect x="98" y="230" width="34" height="80" rx="14" fill="none" stroke="url(#rim)" stroke-width="3"/>
  <g filter="url(#drop)"><rect x="380" y="230" width="34" height="80" rx="14" fill="#ffffff" fill-opacity=".16"/></g>
  <rect x="380" y="230" width="34" height="80" rx="14" fill="url(#sheen)"/>
  <rect x="380" y="230" width="34" height="80" rx="14" fill="none" stroke="url(#rim)" stroke-width="3"/>
  <g filter="url(#drop)"><rect x="132" y="160" width="248" height="216" rx="62" fill="#ffffff" fill-opacity=".2"/></g>
  <rect x="132" y="160" width="248" height="216" rx="62" fill="url(#sheen)"/>
  <rect x="132" y="160" width="248" height="216" rx="62" fill="none" stroke="url(#rim)" stroke-width="3"/>
  <circle cx="208" cy="254" r="32" fill="#d9ff6b" filter="url(#glow)" opacity=".9"/>
  <circle cx="208" cy="254" r="26" fill="#d9ff6b"/>
  <ellipse cx="208" cy="244.12" rx="15.08" ry="8.66667" fill="#fff" opacity=".55"/>
  <circle cx="304" cy="254" r="32" fill="#d9ff6b" filter="url(#glow)" opacity=".9"/>
  <circle cx="304" cy="254" r="26" fill="#d9ff6b"/>
  <ellipse cx="304" cy="244.12" rx="15.08" ry="8.66667" fill="#fff" opacity=".55"/>
  <rect x="220" y="318" width="72" height="14" rx="7" fill="#fff" opacity=".75"/>
</svg>
