<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Agent Dashboard app icon nodes-sunset, generated by scripts/make-icons.py: full-bleed square (the OS
       masks it). Rendered to the PNGs next to it. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4a0f33"/>
      <stop offset=".55" stop-color="#d9476f"/>
      <stop offset="1" stop-color="#ff9a4d"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="46"/></filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="10"/></filter>
    <filter id="drop" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#2a0820" flood-opacity=".35"/></filter>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".55"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".08"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".02"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".95"/>
      <stop offset=".45" stop-color="#fff" stop-opacity=".25"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".6"/>
    </linearGradient>
    <linearGradient id="lit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".95"/>
      <stop offset="1" stop-color="#ffe6dc" stop-opacity=".78"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- colour the glass refracts -->
  <circle cx="150" cy="390" r="120" fill="#ffd166" opacity=".45" filter="url(#soft)"/>
  <circle cx="390" cy="120" r="110" fill="#7a4fd8" opacity=".35" filter="url(#soft)"/>
  <!-- agents connected around a coordinator -->
  <path d="M256 256L150 176" stroke="#fff" stroke-opacity=".5" stroke-width="10" stroke-linecap="round"/>
  <path d="M256 256L372 196" stroke="#fff" stroke-opacity=".5" stroke-width="10" stroke-linecap="round"/>
  <path d="M256 256L240 388" stroke="#fff" stroke-opacity=".5" stroke-width="10" stroke-linecap="round"/>
  <g filter="url(#drop)"><circle cx="150" cy="176" r="44" fill="#ffffff" fill-opacity=".16"/></g>
  <circle cx="150" cy="176" r="44" fill="url(#sheen)"/>
  <circle cx="150" cy="176" r="44" fill="none" stroke="url(#rim)" stroke-width="3"/>
  <g filter="url(#drop)"><circle cx="372" cy="196" r="44" fill="#ffffff" fill-opacity=".16"/></g>
  <circle cx="372" cy="196" r="44" fill="url(#sheen)"/>
  <circle cx="372" cy="196" r="44" fill="none" stroke="url(#rim)" stroke-width="3"/>
  <g filter="url(#drop)"><circle cx="240" cy="388" r="44" fill="#ffffff" fill-opacity=".16"/></g>
  <circle cx="240" cy="388" r="44" fill="url(#sheen)"/>
  <circle cx="240" cy="388" r="44" fill="none" stroke="url(#rim)" stroke-width="3"/>
  <g filter="url(#drop)"><circle cx="256" cy="256" r="64" fill="url(#lit)"/></g>
  <circle cx="256" cy="256" r="64" fill="url(#sheen)"/>
  <circle cx="256" cy="256" r="64" fill="none" stroke="url(#rim)" stroke-width="3"/>
  <circle cx="256" cy="256" r="36" fill="#fff27a" filter="url(#glow)" opacity=".9"/>
  <circle cx="256" cy="256" r="30" fill="#fff27a"/>
  <ellipse cx="256" cy="244.6" rx="17.4" ry="10" fill="#fff" opacity=".55"/>
</svg>
