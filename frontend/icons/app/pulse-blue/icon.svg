<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Agent Dashboard app icon pulse-blue, generated by scripts/make-icons.py: full-bleed square (the OS
       masks it). Rendered to the PNGs next to it. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16206b"/>
      <stop offset=".55" stop-color="#2f5fd6"/>
      <stop offset="1" stop-color="#7a4fd8"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="46"/></filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="10"/></filter>
    <filter id="drop" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0a1040" flood-opacity=".35"/></filter>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".55"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".08"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".02"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".95"/>
      <stop offset=".45" stop-color="#fff" stop-opacity=".25"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".6"/>
    </linearGradient>
    <linearGradient id="lit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".95"/>
      <stop offset="1" stop-color="#dfe8ff" stop-opacity=".78"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- colour the glass refracts -->
  <circle cx="150" cy="390" r="120" fill="#2fd39a" opacity=".45" filter="url(#soft)"/>
  <circle cx="390" cy="120" r="110" fill="#ff8a5c" opacity=".35" filter="url(#soft)"/>
  <!-- one card with a heartbeat: agents alive -->
  <g filter="url(#drop)"><rect x="106" y="136" width="300" height="240" rx="56" fill="#ffffff" fill-opacity=".16"/></g>
  <rect x="106" y="136" width="300" height="240" rx="56" fill="url(#sheen)"/>
  <rect x="106" y="136" width="300" height="240" rx="56" fill="none" stroke="url(#rim)" stroke-width="3"/>
  <path d="M146 262H204L230 202L268 322L298 232L316 262H366" fill="none" stroke="#4fe39a" stroke-width="30" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" opacity=".8"/>
  <path d="M146 262H204L230 202L268 322L298 232L316 262H366" fill="none" stroke="#4fe39a" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
