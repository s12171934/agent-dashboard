<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f5f7">
<title>Agent Dashboard</title>
<!-- PWA: installable from the browser (manifest + sw.js); iOS reads the apple-* tags. The status bar draws over the
     header, which already pads itself with env(safe-area-inset-top). -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<!-- the app icon picked in 「앱 아이콘」 swaps the three links above -->
<script src="icon-boot.js"></script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Agents">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<!-- design system (design-system/, served as ds/): boot scripts first so theme and dock are set before paint -->
<script src="ds/foundations/theme.js"></script>
<script src="ds/foundations/fold.js"></script>
<script src="ds/components/dock/dock-boot.js"></script>
<script type="module" src="ds/ds.js"></script>
<link rel="stylesheet" href="ds/ds.css">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="rust-ui.css">
</head>
<body>
<div id="wasm-loading" class="empty" role="status">화면을 불러오는 중…</div>
<noscript>Agent Dashboard를 사용하려면 JavaScript와 WebAssembly를 허용하세요.</noscript>
<script src="api.js"></script>
<script src="usage.js"></script>
<script type="module" src="rust-ui.js"></script>
<script>if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(console.error);</script>
</body>
</html>
