<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f5f7">
<title>Agent Dashboard</title>
<!-- PWA: installable from the browser (manifest + sw.js); iOS reads the apple-* tags. The status bar draws over the
     header, which already pads itself with env(safe-area-inset-top). -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<!-- the app icon picked in 「앱 아이콘」 swaps the three links above -->
<script src="icon-boot.js"></script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Agents">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<!-- design system (design-system/, served as ds/): boot scripts first so theme and dock are set before paint -->
<script src="ds/foundations/theme.js"></script>
<script src="ds/components/dock/dock-boot.js"></script>
<script type="module" src="ds/ds.js"></script>
<link rel="stylesheet" href="ds/ds.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header>
  <div class="hrow">
    <h1><img src="icons/icon.svg" alt="">Agent Dashboard</h1>
    <div class="kpis-h">
      <div class="stat"><i class="gi"><ds-icon name="play"></ds-icon></i><b id="k-live">–</b><span>실행 중</span></div>
      <div class="stat" id="k-bg-wrap" hidden><i class="gi"><ds-icon name="layers"></ds-icon></i><b id="k-bg">0</b><span>백그라운드</span></div>
      <div class="stat"><i class="gi"><ds-icon name="bot"></ds-icon></i><b id="k-agents">–</b><span>에이전트</span></div>
      <div class="stat"><i class="gi"><ds-icon name="dollar"></ds-icon></i><b id="k-cost">–</b><span>추정 비용</span></div>
      <div class="stat"><i class="gi"><ds-icon name="hash"></ds-icon></i><b id="k-tokens">–</b><span>처리 토큰</span></div>
      <div class="stat"><i class="gi"><ds-icon name="repeat"></ds-icon></i><b id="k-turns">–</b><span>총 턴</span></div>
      <div class="stat"><i class="gi"><ds-icon name="zap"></ds-icon></i><b id="k-runs">–</b><span>진행 Run</span></div>
      <div class="stat dec" id="k-dec-wrap" hidden><i class="gi"><ds-icon name="help"></ds-icon></i><b id="k-dec">0</b><span>결정 대기</span></div>
    </div>
    <div class="conn" id="conn"><i></i><span>연결 중</span></div>
    <div class="health" id="health" hidden></div>
  </div>
</header>
<!-- the floating bar (<ds-dock>): tabs | view filters | metric servers and display settings; data-tip names each.
     The bar adds its own ⋯ settings button (position, size). On a phone it is a launcher pill (summary: set by app.js)
     that opens these same buttons as a sheet, grouped under the separators' data-label. -->
<ds-dock id="dock" inset-from="header">
  <a href="#agents" data-v="agents" data-tip="에이전트" aria-label="에이전트"><ds-icon name="users"></ds-icon></a>
  <a href="#compare" data-v="compare" data-tip="비교" aria-label="비교"><ds-icon name="chart"></ds-icon></a>
  <a href="#talk" data-v="talk" data-tip="상호작용" aria-label="상호작용"><ds-icon name="chat"></ds-icon></a>
  <a href="#projects" data-v="projects" data-tip="프로젝트" aria-label="프로젝트"><ds-icon name="flow"></ds-icon></a>
  <a href="#tests" data-v="tests" data-tip="테스트" aria-label="테스트"><ds-icon name="flask"></ds-icon><b class="dn" id="k-tests" hidden>0</b></a>
  <a href="#hidden" data-v="hidden" data-tip="숨김" aria-label="숨김"><ds-icon name="eye-off"></ds-icon><b class="dn" id="k-hidden" hidden>0</b></a>
  <i class="dock-sep" data-label="필터"></i>
  <label class="dock-btn" data-tip="실행 중만" aria-label="실행 중만"><input type="checkbox" id="only-live"><ds-icon name="pulse"></ds-icon></label>
  <label class="dock-btn" data-tip="Orca 에 열린 것만" aria-label="Orca 에 열린 것만: Orca 에 연결된 터미널에서 돌고 있는 에이전트(「Orca 에서 열기」가 되는 것)만"><input type="checkbox" id="only-orca"><ds-icon name="terminal"></ds-icon></label>
  <i class="dock-sep" data-label="설정"></i>
  <button class="dock-btn" id="srv-btn" data-tip="메트릭 서버" aria-label="메트릭 서버: 연결할 서버와 보기 방식"><ds-icon name="server"></ds-icon><i class="srv-dot"></i></button>
  <ds-theme-toggle id="theme" button-class="dock-btn"></ds-theme-toggle>
  <button class="dock-btn" id="theme-edit" data-tip="색 편집" aria-label="색 편집: 재질과 지금 테마(라이트 또는 다크)의 색을 바꿈"><ds-icon name="palette"></ds-icon></button>
  <button class="dock-btn" id="icon-btn" data-tip="앱 아이콘" aria-label="앱 아이콘: 홈 화면·작업 표시줄에 보일 아이콘을 고름"><ds-icon name="grid"></ds-icon></button>
</ds-dock>
<ds-theme-editor id="theme-panel" class="popover dock-pop" hidden></ds-theme-editor>
<div id="server-panel" class="popover dock-pop" hidden></div>
<div id="icon-panel" class="popover dock-pop" hidden></div>
<div id="decisions" hidden></div>
<main id="view"><div class="empty">불러오는 중…</div></main>
<ds-tooltip id="tip"></ds-tooltip>
<ds-toast id="toast"></ds-toast>
<script src="api.js"></script>
<script src="decision.js"></script>
<script src="app.js"></script>
<script>
// Service worker for the PWA install and offline open; a page served without one (http other than localhost) skips it.
if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
</body>
</html>
